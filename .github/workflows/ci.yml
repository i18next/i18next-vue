name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Execute build
        run: npm run build

      - name: Execute tests
        run: npm run test-ci

      - name: Check formatting
        run: npx prettier . --check
